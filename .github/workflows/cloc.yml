name: Count Lines of Code

# Controls when the action will run. Triggers the workflow on push or pull request 
# events but only for the main branch
on:
  push:
    branches: [ main, copilot/fix-30 ]
  pull_request:
    branches: [ main ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Test on multiple platforms to ensure cross-platform compatibility
  cloc:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job  
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v4

    # Runs the local action to test the PR changes
    - name: Count Lines of Code (cloc)
      uses: ./
    
    - name: Count Lines of Code with additional options
      uses: ./
      with:
          options: --exclude-lang=YAML --md --report-file=cloc.md
    
    - name: Output report .md (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        cat cloc.md
    
    - name: Output report .md (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        Get-Content cloc.md
