# action.yml
name: 'Count Lines of Code (cloc)'
description: 'Count Lines of Code with https://github.com/AlDanial/cloc'
inputs:
  options:
    description: 'Additional options to pass to cloc'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install cloc on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -e
        echo "Installing cloc on Linux..."
        sudo apt-get update
        sudo apt-get install -y cloc git
        echo "✓ cloc installed successfully"
        cloc --version
    
    - name: Install cloc on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -e
        echo "Installing cloc on macOS..."
        # Check if brew is available, install if not
        if ! command -v brew &> /dev/null; then
          echo "Homebrew not found, installing..."
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' >> ~/.bash_profile
          eval "$(/opt/homebrew/bin/brew shellenv)"
        fi
        brew install cloc
        echo "✓ cloc installed successfully"
        cloc --version
    
    - name: Install cloc on Windows
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        Write-Output "Installing cloc on Windows..."
        
        # First try winget (Windows Package Manager) which is more reliable in GitHub Actions
        if (Get-Command winget -ErrorAction SilentlyContinue) {
          Write-Output "Using winget to install cloc..."
          try {
            winget install --id=AlDanial.Cloc --exact --silent --accept-package-agreements --accept-source-agreements
            Write-Output "✓ cloc installed successfully with winget"
            cloc --version
            exit 0
          }
          catch {
            Write-Output "winget installation failed, falling back to chocolatey..."
          }
        }
        
        # Fallback to chocolatey
        # Check if chocolatey is available
        if (!(Get-Command choco -ErrorAction SilentlyContinue)) {
          Write-Output "Chocolatey not found, installing..."
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          
          # Use Invoke-RestMethod instead of DownloadString for better reliability
          $installScript = Invoke-RestMethod -Uri 'https://community.chocolatey.org/install.ps1'
          Invoke-Expression $installScript
          
          # Refresh environment variables
          $env:PATH = [Environment]::GetEnvironmentVariable("PATH","Machine") + ";" + [Environment]::GetEnvironmentVariable("PATH","User")
          refreshenv
        }
        
        Write-Output "Installing cloc with chocolatey..."
        choco install cloc -y --no-progress
        Write-Output "✓ cloc installed successfully"
        cloc --version
    
    - name: Verify cloc installation (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        if ! command -v cloc &> /dev/null; then
          echo "❌ cloc installation failed"
          exit 1
        fi
        echo "✓ cloc is available and ready to use"
    
    - name: Verify cloc installation (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        if (!(Get-Command cloc -ErrorAction SilentlyContinue)) {
          Write-Output "❌ cloc installation failed"
          exit 1
        }
        Write-Output "✓ cloc is available and ready to use"
    
    - name: Trust workspace and run cloc (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -e
        echo "Running cloc on ${{ runner.os }}..."
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        commit=$(git rev-parse HEAD)
        echo "Analyzing commit: $commit"
        
        if [ -n "${{ inputs.options }}" ]; then
          echo "Running: cloc $commit ${{ inputs.options }}"
          cloc $commit ${{ inputs.options }} | tee -a cloc.txt
        else
          echo "Running: cloc $commit"
          cloc $commit | tee -a cloc.txt
        fi
        
        echo "✓ cloc analysis completed"
    
    - name: Trust workspace and run cloc (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        Write-Output "Running cloc on Windows..."
        git config --global --add safe.directory "$env:GITHUB_WORKSPACE"
        $commit = git rev-parse HEAD
        Write-Output "Analyzing commit: $commit"
        
        $options = "${{ inputs.options }}"
        if ($options) {
          Write-Output "Running: cloc $commit $options"
          Invoke-Expression "cloc $commit $options" | Tee-Object -FilePath cloc.txt -Append
        } else {
          Write-Output "Running: cloc $commit"
          Invoke-Expression "cloc $commit" | Tee-Object -FilePath cloc.txt -Append
        }
        
        Write-Output "✓ cloc analysis completed"

branding:
  icon: 'code'  
  color: 'blue'
