# action.yml
name: 'Count Lines of Code (cloc)'
description: 'Count Lines of Code with https://github.com/AlDanial/cloc'
inputs:
  options:
    description: 'Additional options to pass to cloc'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install cloc on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y cloc git
    
    - name: Install cloc on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install cloc
    
    - name: Install cloc on Windows
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        choco install cloc -y
    
    - name: Trust workspace and run cloc (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        cloc $(git rev-parse HEAD) ${{ inputs.options }} | tee -a cloc.txt
    
    - name: Trust workspace and run cloc (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        git config --global --add safe.directory "$env:GITHUB_WORKSPACE"
        $commit = git rev-parse HEAD
        $options = "${{ inputs.options }}"
        if ($options) {
          cloc $commit $options | Tee-Object -FilePath cloc.txt -Append
        } else {
          cloc $commit | Tee-Object -FilePath cloc.txt -Append
        }

branding:
  icon: 'code'  
  color: 'blue'
