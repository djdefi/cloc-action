# action.yml
name: 'Count Lines of Code (cloc)'
description: 'Count Lines of Code with https://github.com/AlDanial/cloc'
inputs:
  options:
    description: 'Additional options to pass to cloc'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install cloc on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -e
        echo "Installing cloc on Linux..."
        sudo apt-get update
        sudo apt-get install -y cloc git
        echo "✓ cloc installed successfully"
        cloc --version
    
    - name: Install cloc on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -e
        echo "Installing cloc on macOS..."
        # Check if brew is available, install if not
        if ! command -v brew &> /dev/null; then
          echo "Homebrew not found, installing..."
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' >> ~/.bash_profile
          eval "$(/opt/homebrew/bin/brew shellenv)"
        fi
        brew install cloc
        echo "✓ cloc installed successfully"
        cloc --version
    
    - name: Install cloc on Windows
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        Write-Output "Installing cloc on Windows..."
        
        # Create a directory for cloc
        $clocDir = "$env:USERPROFILE\cloc"
        New-Item -ItemType Directory -Path $clocDir -Force | Out-Null
        $clocPath = "$clocDir\cloc.exe"
        
        # Try direct download from GitHub releases first
        try {
          Write-Output "Downloading cloc from GitHub releases..."
          $downloadUrl = "https://github.com/AlDanial/cloc/releases/download/v2.02/cloc-2.02.exe"
          Invoke-WebRequest -Uri $downloadUrl -OutFile $clocPath -UseBasicParsing
          
          # Add to PATH for this session
          $env:PATH = "$clocDir;$env:PATH"
          
          Write-Output "✓ cloc downloaded successfully"
          & $clocPath --version
        }
        catch {
          Write-Output "GitHub download failed, trying chocolatey fallback..."
          
          # Fallback to chocolatey if direct download fails
          if (!(Get-Command choco -ErrorAction SilentlyContinue)) {
            Write-Output "Installing chocolatey..."
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
            Invoke-Expression ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
            $env:PATH = [Environment]::GetEnvironmentVariable("PATH","Machine") + ";" + [Environment]::GetEnvironmentVariable("PATH","User")
          }
          
          choco install cloc -y --no-progress
          $env:PATH = [Environment]::GetEnvironmentVariable("PATH","Machine") + ";" + [Environment]::GetEnvironmentVariable("PATH","User")
          Write-Output "✓ cloc installed via chocolatey"
          cloc --version
        }
    
    - name: Verify cloc installation (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        if ! command -v cloc &> /dev/null; then
          echo "❌ cloc installation failed"
          exit 1
        fi
        echo "✓ cloc is available and ready to use"
    
    - name: Verify cloc installation (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        # Check if cloc is available in PATH or in our custom directory
        $clocDir = "$env:USERPROFILE\cloc"
        $clocPath = "$clocDir\cloc.exe"
        
        if (Get-Command cloc -ErrorAction SilentlyContinue) {
          Write-Output "✓ cloc is available in PATH"
        } elseif (Test-Path $clocPath) {
          # Add our custom directory to PATH if cloc is there
          $env:PATH = "$clocDir;$env:PATH"
          Write-Output "✓ cloc is available in custom directory"
        } else {
          Write-Output "❌ cloc installation failed"
          exit 1
        }
        Write-Output "✓ cloc is ready to use"
    
    - name: Trust workspace and run cloc (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -e
        echo "Running cloc on ${{ runner.os }}..."
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        commit=$(git rev-parse HEAD)
        echo "Analyzing commit: $commit"
        
        if [ -n "${{ inputs.options }}" ]; then
          echo "Running: cloc $commit ${{ inputs.options }}"
          cloc $commit ${{ inputs.options }} | tee -a cloc.txt
        else
          echo "Running: cloc $commit"
          cloc $commit | tee -a cloc.txt
        fi
        
        echo "✓ cloc analysis completed"
    
    - name: Trust workspace and run cloc (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        Write-Output "Running cloc on Windows..."
        
        # Ensure cloc is in PATH (handle custom directory)
        $clocDir = "$env:USERPROFILE\cloc"
        if (Test-Path "$clocDir\cloc.exe") {
          $env:PATH = "$clocDir;$env:PATH"
        }
        
        git config --global --add safe.directory "$env:GITHUB_WORKSPACE"
        $commit = git rev-parse HEAD
        Write-Output "Analyzing commit: $commit"
        
        $options = "${{ inputs.options }}"
        if ($options) {
          Write-Output "Running: cloc $commit $options"
          Invoke-Expression "cloc $commit $options" | Tee-Object -FilePath cloc.txt -Append
        } else {
          Write-Output "Running: cloc $commit"
          Invoke-Expression "cloc $commit" | Tee-Object -FilePath cloc.txt -Append
        }
        
        Write-Output "✓ cloc analysis completed"

branding:
  icon: 'code'  
  color: 'blue'
